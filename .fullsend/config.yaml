# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
#
# Layering: .fullsend/config.base.yaml is fullsend-ai/fullsend's own .fullsend/config.yaml,
# copied byte for byte at 003926f5cd3a (sha256 620f017aecedca67…). Runtime, roles, agents,
# model aliases and status notifications come from there; refresh it by re-running
#   fullsend github setup fullsend-ai/pi-inference-gateway --config <raw URL at a newer sha> --config-hash <sha256>
# This file keeps only what is specific to this repository.
version: "1"
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai/pi-inference-gateway
            - fullsend-ai/fullsend
inference:
    project: it-gcp-konflux-prod-fullsend
    wif_provider: projects/155031062349/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-fullsend-ai-pi-inference-gate
